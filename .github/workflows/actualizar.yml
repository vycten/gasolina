name: Actualizar Reporte Diario

on:
  schedule:
    - cron: '0 12 * * *' # Se ejecuta automáticamente todos los días a las 12:00 UTC
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña "Actions" en GitHub

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance

      - name: Ejecutar script de generación
        run: python actualizar.py

      - name: Commit y Push de index.html actualizado
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Actualización automática de precios de combustible [skip ci]"
          git push